name: Refresh Profile Card & Metrics

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'assets/portrait.txt'
      - 'package.json'
      - '.github/workflows/metrics.yml'

permissions:
  contents: write

# Scheduled and push runs both commit to the default branch; never let them overlap.
concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Test Suite
        run: |
          npm test

      - name: Generate Profile Card SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run generate

      - name: Commit and Push Updated Profile Card
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain assets/profile-card.svg)" ]; then
            git add assets/profile-card.svg
            git commit -m "chore(card): refresh profile card [skip ci]"
            git pull --rebase
            git push
            echo "Profile card updated and pushed."
          else
            echo "No changes in the profile card."
          fi

      # Secrets are not allowed in `if`; expose only a has/has-not flag, scoped to this step.
      - name: Check METRICS_TOKEN
        id: gate
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "has=1" >> "$GITHUB_OUTPUT"; fi

      # Runs after the card push: lowlighter commits through the API on top of the new HEAD.
      - name: Render lowlighter Metrics
        if: ${{ steps.gate.outputs.has == '1' }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ivan-olivera-dev
          template: classic
          filename: assets/metrics.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): refresh lowlighter metrics [skip ci]"
          base: ""
          config_timezone: Europe/Madrid
          config_display: large
          config_order: isocalendar, languages, habits, achievements, activity
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_colors: "0:#7aa2f7, 1:#e0af68, 2:#9ece6a, 3:#bb9af7, 4:#7dcfff, 5:#f7768e"
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 8
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          extras_css: |
            /* Tokyo Night */
            svg { color: #a9b1d6; }
            .items-wrapper { background: #1a1b26; border: 1px solid #292e42; border-radius: 12px; padding: 4px 12px 8px; }
            h1, h2, h3 { color: #7aa2f7 !important; }
            h1 svg, h2 svg, h3 svg { fill: #7aa2f7 !important; }
            .field { color: #c0caf5; }
            .field svg { fill: #565f89; }
            a { color: #7dcfff !important; }
            small, .field small { color: #565f89; }
            path[fill="#ebedf0" i] { fill: #24283b; }
            path[fill="#9be9a8" i] { fill: #3d59a1; }
            path[fill="#40c463" i] { fill: #7aa2f7; }
            path[fill="#30a14e" i] { fill: #9d7cd8; }
            path[fill="#216e39" i] { fill: #bb9af7; }

      - name: Skip lowlighter Metrics (no METRICS_TOKEN)
        if: ${{ steps.gate.outputs.has != '1' }}
        run: echo "::warning::METRICS_TOKEN secret is not set; assets/metrics.svg was not refreshed."
