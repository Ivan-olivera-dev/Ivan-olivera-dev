<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Commit habits of ivan by hour and weekday">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; white-space: pre; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
    .info { font-size: 13px; fill: #c0caf5; }
    .bar { font-size: 13px; }
    .head { font-size: 13px; fill: #7dcfff; font-weight: 700; }
    .axis { font-size: 11px; fill: #565f89; }
    .track { fill: #292e42; }
    .key { fill: #7aa2f7; font-weight: 700; }
    .dim { fill: #565f89; }
    .host { fill: #bb9af7; font-weight: 700; }
    .prompt { fill: #9ece6a; font-weight: 700; }
    .title { font-size: 12px; fill: #565f89; }
    .cursor { fill: #c0caf5; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <clipPath id="window"><rect width="900" height="330" rx="12"/></clipPath>
