<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" fill="none">
  <defs>
    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 21px;
        font-weight: 600;
        fill: #f4f4f5;
        letter-spacing: -0.4px;
      }
      .role {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 400;
        fill: #a1a1aa;
      }
      .section-index {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 600;
        fill: #10b981;
        letter-spacing: 0.8px;
      }
      .section-title {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 600;
        fill: #71717a;
        letter-spacing: 0.9px;
      }
      .body-copy {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 400;
        fill: #d4d4d8;
      }
      .item-title {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        fill: #f4f4f5;
      }
      .item-sub {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 11.5px;
        font-weight: 400;
        fill: #a1a1aa;
      }
      .lang-name {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #e4e4e7;
      }
      .lang-pct {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #a1a1aa;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 400;
        fill: #a1a1aa;
      }
      .mono-muted {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 400;
        fill: #71717a;
      }
      .chip-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 500;
        fill: #d4d4d8;
      }
      .node-label {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 500;
        fill: #a1a1aa;
      }
      .stat-val {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 15px;
        font-weight: 600;
        fill: #f4f4f5;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.9; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      .animated-link {
        stroke-dasharray: 3 3;
        animation: dashFlow 2.2s linear infinite;
      }
      .soft-pulse {
        animation: pulseGlow 3.5s ease-in-out infinite;
      }
    </style>

    <!-- Background Dot Matrix Pattern -->
    <pattern id="dot-matrix" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07" />
    </pattern>

    <!-- Radial Mask for Dot Matrix -->
    <radialGradient id="matrix-fade" cx="75%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="matrix-mask">
      <rect x="0" y="0" width="860" height="410" fill="url(#matrix-fade)" />
    </mask>

    <!-- Ambient Emerald Spotlight -->
    <radialGradient id="emerald-spotlight" cx="82%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.11" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0" />
    </radialGradient>

    <!-- Sparkline Area Gradient -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bar Accent Gradient -->
    <linearGradient id="bar-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Horizontal Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f1f23" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1f1f23" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Surface (#0a0a0a) -->
  <rect x="0.5" y="0.5" width="859" height="409" rx="12" fill="#0a0a0a" stroke="#222226" stroke-width="1" />

  <!-- Ambient Spotlight + Masked Dot Matrix -->
  <rect x="1" y="1" width="858" height="408" rx="11.5" fill="url(#emerald-spotlight)" />
  <rect x="1" y="1" width="858" height="408" rx="11.5" fill="url(#dot-matrix)" mask="url(#matrix-mask)" />

  <!-- ================================================================= -->
  <!-- HEADER                                                            -->
  <!-- ================================================================= -->
  <g transform="translate(36, 38)">
    <!-- Subtle Geometric Emblem -->
    <g transform="translate(0, -16)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#111114" stroke="#27272a" stroke-width="1" />
      <path d="M10 17 L17 10 L24 17 L17 24 Z" stroke="#10b981" stroke-width="1.5" fill="#10b981" fill-opacity="0.12" />
      <circle cx="17" cy="17" r="2" fill="#34d399" class="soft-pulse" />
    </g>

    <text x="48" y="0" class="name">Iván Olivera González</text>
    <text x="48" y="21" class="role">Software Engineer — Backend, Systems &amp; Agentic Workflows</text>
  </g>

  <!-- Right Header Badge (Location & Domain with Live Pulse) -->
  <g transform="translate(600, 26)">
    <rect x="0" y="0" width="224" height="30" rx="15" fill="#111115" stroke="#27272a" stroke-width="1" />
    <circle cx="18" cy="15" r="6" fill="#10b981" fill-opacity="0.2">
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.35;0.08;0.35" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="18" cy="15" r="3" fill="#10b981" />
    <text x="32" y="19" class="mono-meta">Valencia, ES · ivanolivera.dev</text>
  </g>

  <!-- Horizontal Structural Divider with Subtle Animated Shimmer Beam -->
  <line x1="36" y1="84" x2="824" y2="84" stroke="#1f1f23" stroke-width="1" />
  <rect x="36" y="83.5" width="140" height="1.5" fill="url(#beam-grad)">
    <animate attributeName="x" values="36;684;36" dur="9s" repeatCount="indefinite" />
  </rect>

  <!-- ================================================================= -->
  <!-- COLUMN 1: 01 / FOCUS & ARCHITECTURE TOPOLOGY (x: 36, width: 244)  -->
  <!-- ================================================================= -->
  <g transform="translate(36, 110)">
    <text x="0" y="0" class="section-index">01</text>
    <text x="22" y="0" class="section-title">FOCUS &amp; APPROACH</text>

    <text x="0" y="26" class="body-copy">Designing and building backend services,</text>
    <text x="0" y="45" class="body-copy">system architectures, and practical</text>
    <text x="0" y="64" class="body-copy">multi-agent development workflows.</text>

    <!-- Visual Interactive Topology Card -->
    <g transform="translate(0, 82)">
      <rect x="0" y="0" width="244" height="92" rx="8" fill="#0f0f13" stroke="#1f1f23" stroke-width="1" />
      <text x="14" y="18" class="mono-muted">ARCHITECTURE FLOW</text>
      <circle cx="226" cy="14" r="2.5" fill="#10b981" class="soft-pulse" />

      <!-- Animated Flow Lines -->
      <line x1="56" y1="48" x2="102" y2="48" stroke="#27272a" stroke-width="1.5" />
      <line x1="56" y1="48" x2="102" y2="48" stroke="#10b981" stroke-width="1.5" class="animated-link" />

      <line x1="142" y1="48" x2="188" y2="48" stroke="#27272a" stroke-width="1.5" />
      <line x1="142" y1="48" x2="188" y2="48" stroke="#10b981" stroke-width="1.5" class="animated-link" />

      <!-- Node 1: ODD -->
      <rect x="20" y="34" width="36" height="28" rx="6" fill="#16161c" stroke="#27272a" stroke-width="1" />
      <path d="M33 44 L29 48 L33 52 M43 44 L47 48 L43 52" stroke="#a1a1aa" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="38" y="76" text-anchor="middle" class="node-label">ODD</text>

      <!-- Node 2: Agents (Center Highlighted) -->
      <rect x="102" y="32" width="40" height="32" rx="7" fill="#111f1a" stroke="#10b981" stroke-opacity="0.55" stroke-width="1" />
      <circle cx="122" cy="48" r="5" stroke="#34d399" stroke-width="1.4" fill="none" />
      <circle cx="122" cy="48" r="1.8" fill="#10b981" />
      <text x="122" y="76" text-anchor="middle" class="node-label" fill="#d4d4d8">Agents</text>

      <!-- Node 3: Systems Core -->
      <rect x="188" y="34" width="36" height="28" rx="6" fill="#16161c" stroke="#27272a" stroke-width="1" />
      <rect x="199" y="42" width="14" height="5" rx="1" stroke="#a1a1aa" stroke-width="1.2" />
      <rect x="199" y="49" width="14" height="5" rx="1" stroke="#a1a1aa" stroke-width="1.2" />
      <text x="206" y="76" text-anchor="middle" class="node-label">Systems</text>
    </g>

    <!-- Tech Stack Pills Row -->
    <g transform="translate(0, 186)">
      
      <rect x="0" y="0" width="48" height="22" rx="5" fill="#121216" stroke="#232329" stroke-width="1" />
      <text x="24" y="14.5" text-anchor="middle" class="chip-text">Node.js</text>
      <rect x="52" y="0" width="66" height="22" rx="5" fill="#121216" stroke="#232329" stroke-width="1" />
      <text x="85" y="14.5" text-anchor="middle" class="chip-text">TypeScript</text>
      <rect x="122" y="0" width="42" height="22" rx="5" fill="#121216" stroke="#232329" stroke-width="1" />
      <text x="143" y="14.5" text-anchor="middle" class="chip-text">Python</text>
      <rect x="168" y="0" width="38" height="22" rx="5" fill="#121216" stroke="#232329" stroke-width="1" />
      <text x="187" y="14.5" text-anchor="middle" class="chip-text">Docker</text>
      <rect x="210" y="0" width="34" height="22" rx="5" fill="#121216" stroke="#232329" stroke-width="1" />
      <text x="227" y="14.5" text-anchor="middle" class="chip-text">Linux</text>
    </g>
  </g>

  <!-- Vertical Structural Divider 1 -->
  <line x1="300" y1="102" x2="300" y2="326" stroke="#1f1f23" stroke-width="1" />

  <!-- ================================================================= -->
  <!-- COLUMN 2: 02 / PRIMARY STACK & CADENCE WAVE (x: 322, width: 236)  -->
  <!-- ================================================================= -->
  <g transform="translate(322, 110)">
    <text x="0" y="0" class="section-index">02</text>
    <text x="22" y="0" class="section-title">PRIMARY STACK</text>

    
    <g transform="translate(0, 24)">
      <text x="0" y="0" class="lang-name">TypeScript &amp; Node.js</text>
      <text x="236" y="0" text-anchor="end" class="lang-pct">44%</text>
      <rect x="0" y="7" width="236" height="4.5" rx="2.25" fill="#18181c" />
      <rect x="0" y="7" width="104" height="4.5" rx="2.25" fill="url(#bar-emerald)" />
    </g>
    <g transform="translate(0, 58)">
      <text x="0" y="0" class="lang-name">Python</text>
      <text x="236" y="0" text-anchor="end" class="lang-pct">26%</text>
      <rect x="0" y="7" width="236" height="4.5" rx="2.25" fill="#18181c" />
      <rect x="0" y="7" width="61" height="4.5" rx="2.25" fill="#34d399" />
    </g>
    <g transform="translate(0, 92)">
      <text x="0" y="0" class="lang-name">Linux &amp; Shell (Bash)</text>
      <text x="236" y="0" text-anchor="end" class="lang-pct">18%</text>
      <rect x="0" y="7" width="236" height="4.5" rx="2.25" fill="#18181c" />
      <rect x="0" y="7" width="42" height="4.5" rx="2.25" fill="#6ee7b7" />
    </g>
    <g transform="translate(0, 126)">
      <text x="0" y="0" class="lang-name">Java</text>
      <text x="236" y="0" text-anchor="end" class="lang-pct">12%</text>
      <rect x="0" y="7" width="236" height="4.5" rx="2.25" fill="#18181c" />
      <rect x="0" y="7" width="28" height="4.5" rx="2.25" fill="#52525b" />
    </g>

    <!-- Activity Sparkline Graph Card -->
    <g transform="translate(0, 158)">
      <rect x="0" y="0" width="236" height="50" rx="8" fill="#0f0f13" stroke="#1f1f23" stroke-width="1" />
      <text x="12" y="18" class="mono-muted">DEVELOPMENT CADENCE</text>
      <text x="224" y="18" text-anchor="end" class="mono-meta" fill="#10b981">Active</text>

      <!-- Smooth Sparkline Curve -->
      <path d="M 12 40 Q 38 38, 56 32 T 98 34 T 142 26 T 186 29 T 224 22 L 224 44 L 12 44 Z" fill="url(#spark-grad)" />
      <path d="M 12 40 Q 38 38, 56 32 T 98 34 T 142 26 T 186 29 T 224 22" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <circle cx="224" cy="22" r="2.5" fill="#34d399">
        <animate attributeName="r" values="2;3.8;2" dur="2.4s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Vertical Structural Divider 2 -->
  <line x1="580" y1="102" x2="580" y2="326" stroke="#1f1f23" stroke-width="1" />

  <!-- ================================================================= -->
  <!-- COLUMN 3: 03 / CURRENTLY BUILDING (x: 602, width: 222)            -->
  <!-- ================================================================= -->
  <g transform="translate(602, 110)">
    <text x="0" y="0" class="section-index">03</text>
    <text x="22" y="0" class="section-title">CURRENTLY BUILDING</text>

    <!-- Work Item 1 with Vector Icon -->
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="222" height="64" rx="8" fill="#111115" stroke="#1f1f23" stroke-width="1" />
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#141d19" stroke="#10b981" stroke-opacity="0.35" stroke-width="1" />
      <!-- Node Network Icon -->
      <circle cx="26" cy="23" r="2" fill="#34d399" />
      <circle cx="21" cy="32" r="2" fill="#10b981" />
      <circle cx="31" cy="32" r="2" fill="#10b981" />
      <path d="M26 25 L21 30 M26 25 L31 30 M21 32 L31 32" stroke="#10b981" stroke-width="1.2" />

      <text x="50" y="26" class="item-title">Agentic Workflows &amp; ODD</text>
      <text x="50" y="44" class="item-sub">Organic-driven dev &amp; tooling</text>
    </g>

    <!-- Work Item 2 with Vector Icon -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="222" height="64" rx="8" fill="#111115" stroke="#1f1f23" stroke-width="1" />
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#16161c" stroke="#27272a" stroke-width="1" />
      <!-- Layered Stack Icon -->
      <path d="M20 24 L26 21 L32 24 L26 27 Z" stroke="#a1a1aa" stroke-width="1.2" fill="none" />
      <path d="M20 28.5 L26 31.5 L32 28.5" stroke="#10b981" stroke-width="1.2" fill="none" stroke-linecap="round" />
      <path d="M20 32.5 L26 35.5 L32 32.5" stroke="#71717a" stroke-width="1.2" fill="none" stroke-linecap="round" />

      <text x="50" y="26" class="item-title">Backend &amp; Systems</text>
      <text x="50" y="44" class="item-sub">APIs, Docker infra &amp; Linux</text>
    </g>

    <!-- Compact Activity Row -->
    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="106" height="42" rx="7" fill="#111115" stroke="#1f1f23" stroke-width="1" />
      <text x="14" y="26" class="stat-val">12 <tspan class="mono-muted" dx="4">Repos</tspan></text>

      <rect x="116" y="0" width="106" height="42" rx="7" fill="#111115" stroke="#1f1f23" stroke-width="1" />
      <text x="130" y="26" class="stat-val">480+ <tspan class="mono-muted" dx="2">Commits</tspan></text>
    </g>
  </g>

  <!-- Bottom Structural Divider -->
  <line x1="36" y1="348" x2="824" y2="348" stroke="#1f1f23" stroke-width="1" />

  <!-- Footer Metadata -->
  <g transform="translate(36, 378)">
    <circle cx="5" cy="-4" r="2.5" fill="#10b981" />
    <text x="16" y="0" class="mono-meta">Portfolio <tspan fill="#f4f4f5">ivanolivera.dev</tspan>   ·   NFC Card <tspan fill="#f4f4f5">card.ivanolivera.dev</tspan></text>
    <text x="788" y="0" text-anchor="end" class="mono-muted">ES · EN · VAL   —   Updated automatically via GitHub Actions</text>
  </g>
</svg>