<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 430" width="100%" height="430" fill="none">
  <defs>
    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 23px;
        font-weight: 600;
        fill: #f4f4f5;
        letter-spacing: -0.4px;
      }
      .role {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #a1a1aa;
      }
      .section-index {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 700;
        fill: #10b981;
        letter-spacing: 0.8px;
      }
      .section-title {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 600;
        fill: #8b949e;
        letter-spacing: 0.9px;
      }
      .body-copy {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #e4e4e7;
      }
      .item-title {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        fill: #f4f4f5;
      }
      .item-sub {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #a1a1aa;
      }
      .lang-name {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #e4e4e7;
      }
      .lang-pct {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #a1a1aa;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 400;
        fill: #a1a1aa;
      }
      .mono-muted {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 400;
        fill: #71717a;
      }
      .chip-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 500;
        fill: #d4d4d8;
      }
      .node-label {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        fill: #a1a1aa;
      }
      .stat-val {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 16px;
        font-weight: 700;
        fill: #f4f4f5;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.9; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      .animated-link {
        stroke-dasharray: 3 3;
        animation: dashFlow 2.2s linear infinite;
      }
      .soft-pulse {
        animation: pulseGlow 3.5s ease-in-out infinite;
      }
    </style>

    <!-- Background Dot Matrix Pattern -->
    <pattern id="dot-matrix" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07" />
    </pattern>

    <!-- Radial Mask for Dot Matrix -->
    <radialGradient id="matrix-fade" cx="75%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="matrix-mask">
      <rect x="0" y="0" width="890" height="430" fill="url(#matrix-fade)" />
    </mask>

    <!-- Ambient Emerald Spotlight -->
    <radialGradient id="emerald-spotlight" cx="82%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0" />
    </radialGradient>

    <!-- Sparkline Area Gradient -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bar Accent Gradient -->
    <linearGradient id="bar-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Horizontal Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f1f23" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1f1f23" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Surface (#0a0a0a) -->
  <rect x="0.5" y="0.5" width="889" height="429" rx="12" fill="#0a0a0a" stroke="#222226" stroke-width="1" />

  <!-- Ambient Spotlight + Masked Dot Matrix -->
  <rect x="1" y="1" width="888" height="428" rx="11.5" fill="url(#emerald-spotlight)" />
  <rect x="1" y="1" width="888" height="428" rx="11.5" fill="url(#dot-matrix)" mask="url(#matrix-mask)" />

  <!-- ================================================================= -->
  <!-- HEADER                                                            -->
  <!-- ================================================================= -->
  <g transform="translate(38, 42)">
    <!-- Geometric Emblem -->
    <g transform="translate(0, -18)">
      <rect x="0" y="0" width="38" height="38" rx="8" fill="#111114" stroke="#27272a" stroke-width="1" />
      <path d="M11 19 L19 11 L27 19 L19 27 Z" stroke="#10b981" stroke-width="1.6" fill="#10b981" fill-opacity="0.12" />
      <circle cx="19" cy="19" r="2.2" fill="#34d399" class="soft-pulse" />
    </g>

    <text x="52" y="2" class="name">Iván Olivera González</text>
    <text x="52" y="25" class="role">Software Engineer — Backend, Systems &amp; Agentic Workflows</text>
  </g>

  <!-- Right Header Badge (Location & Domain with Live Pulse) -->
  <g transform="translate(610, 28)">
    <rect x="0" y="0" width="242" height="32" rx="16" fill="#111115" stroke="#27272a" stroke-width="1" />
    <circle cx="20" cy="16" r="6.5" fill="#10b981" fill-opacity="0.2">
      <animate attributeName="r" values="4.5;7.5;4.5" dur="3s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.35;0.08;0.35" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="20" cy="16" r="3.2" fill="#10b981" />
    <text x="36" y="20" class="mono-meta">Valencia, ES · ivanolivera.dev</text>
  </g>

  <!-- Horizontal Structural Divider with Animated Beam -->
  <line x1="38" y1="92" x2="852" y2="92" stroke="#1f1f23" stroke-width="1" />
  <rect x="38" y="91.5" width="160" height="1.5" fill="url(#beam-grad)">
    <animate attributeName="x" values="38;692;38" dur="8.5s" repeatCount="indefinite" />
  </rect>

  <!-- ================================================================= -->
  <!-- COLUMN 1: 01 / FOCUS & ARCHITECTURE TOPOLOGY                      -->
  <!-- ================================================================= -->
  <g transform="translate(38, 118)">
    <text x="0" y="0" class="section-index">01</text>
    <text x="24" y="0" class="section-title">FOCUS &amp; APPROACH</text>

    <text x="0" y="28" class="body-copy">Designing and building backend services,</text>
    <text x="0" y="49" class="body-copy">system architectures, and practical</text>
    <text x="0" y="70" class="body-copy">multi-agent development workflows.</text>

    <!-- Architecture Flow Card -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="252" height="96" rx="8" fill="#0f0f13" stroke="#1f1f23" stroke-width="1" />
      <text x="16" y="20" class="mono-muted">ARCHITECTURE FLOW</text>
      <circle cx="234" cy="16" r="2.5" fill="#10b981" class="soft-pulse" />

      <!-- Flow Lines -->
      <line x1="60" y1="50" x2="104" y2="50" stroke="#27272a" stroke-width="1.5" />
      <line x1="60" y1="50" x2="104" y2="50" stroke="#10b981" stroke-width="1.5" class="animated-link" />

      <line x1="148" y1="50" x2="192" y2="50" stroke="#27272a" stroke-width="1.5" />
      <line x1="148" y1="50" x2="192" y2="50" stroke="#10b981" stroke-width="1.5" class="animated-link" />

      <!-- Node 1: ODD -->
      <rect x="20" y="35" width="40" height="30" rx="6" fill="#16161c" stroke="#27272a" stroke-width="1" />
      <path d="M34 45 L30 50 L34 55 M46 45 L50 50 L46 55" stroke="#a1a1aa" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="40" y="80" text-anchor="middle" class="node-label">ODD</text>

      <!-- Node 2: Agents (Center Highlighted) -->
      <rect x="104" y="33" width="44" height="34" rx="7" fill="#111f1a" stroke="#10b981" stroke-opacity="0.6" stroke-width="1" />
      <circle cx="126" cy="50" r="5.5" stroke="#34d399" stroke-width="1.4" fill="none" />
      <circle cx="126" cy="50" r="2" fill="#10b981" />
      <text x="126" y="80" text-anchor="middle" class="node-label" fill="#d4d4d8">Agents</text>

      <!-- Node 3: Systems Core -->
      <rect x="192" y="35" width="40" height="30" rx="6" fill="#16161c" stroke="#27272a" stroke-width="1" />
      <rect x="204" y="44" width="16" height="5" rx="1" stroke="#a1a1aa" stroke-width="1.2" />
      <rect x="204" y="52" width="16" height="5" rx="1" stroke="#a1a1aa" stroke-width="1.2" />
      <text x="212" y="80" text-anchor="middle" class="node-label">Systems</text>
    </g>

    <!-- Tech Stack Pills Row -->
    <g transform="translate(0, 198)">
      
      <rect x="0" y="0" width="50" height="24" rx="5" fill="#121216" stroke="#232329" stroke-width="1" />
      <text x="25" y="15.5" text-anchor="middle" class="chip-text">Node.js</text>
      <rect x="54" y="0" width="68" height="24" rx="5" fill="#121216" stroke="#232329" stroke-width="1" />
      <text x="88" y="15.5" text-anchor="middle" class="chip-text">TypeScript</text>
      <rect x="126" y="0" width="44" height="24" rx="5" fill="#121216" stroke="#232329" stroke-width="1" />
      <text x="148" y="15.5" text-anchor="middle" class="chip-text">Python</text>
      <rect x="174" y="0" width="40" height="24" rx="5" fill="#121216" stroke="#232329" stroke-width="1" />
      <text x="194" y="15.5" text-anchor="middle" class="chip-text">Docker</text>
      <rect x="218" y="0" width="34" height="24" rx="5" fill="#121216" stroke="#232329" stroke-width="1" />
      <text x="235" y="15.5" text-anchor="middle" class="chip-text">Linux</text>
    </g>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="312" y1="110" x2="312" y2="344" stroke="#1f1f23" stroke-width="1" />

  <!-- ================================================================= -->
  <!-- COLUMN 2: 02 / PRIMARY STACK & CADENCE WAVE                       -->
  <!-- ================================================================= -->
  <g transform="translate(334, 118)">
    <text x="0" y="0" class="section-index">02</text>
    <text x="24" y="0" class="section-title">PRIMARY STACK</text>

    
    <g transform="translate(0, 26)">
      <text x="0" y="0" class="lang-name">TypeScript</text>
      <text x="248" y="0" text-anchor="end" class="lang-pct">68%</text>
      <rect x="0" y="8" width="248" height="5" rx="2.5" fill="#18181c" />
      <rect x="0" y="8" width="169" height="5" rx="2.5" fill="url(#bar-emerald)" />
    </g>
    <g transform="translate(0, 62)">
      <text x="0" y="0" class="lang-name">Python</text>
      <text x="248" y="0" text-anchor="end" class="lang-pct">25%</text>
      <rect x="0" y="8" width="248" height="5" rx="2.5" fill="#18181c" />
      <rect x="0" y="8" width="62" height="5" rx="2.5" fill="#34d399" />
    </g>
    <g transform="translate(0, 98)">
      <text x="0" y="0" class="lang-name">Shell</text>
      <text x="248" y="0" text-anchor="end" class="lang-pct">6%</text>
      <rect x="0" y="8" width="248" height="5" rx="2.5" fill="#18181c" />
      <rect x="0" y="8" width="15" height="5" rx="2.5" fill="#6ee7b7" />
    </g>
    <g transform="translate(0, 134)">
      <text x="0" y="0" class="lang-name">Dockerfile</text>
      <text x="248" y="0" text-anchor="end" class="lang-pct">2%</text>
      <rect x="0" y="8" width="248" height="5" rx="2.5" fill="#18181c" />
      <rect x="0" y="8" width="10" height="5" rx="2.5" fill="#52525b" />
    </g>

    <!-- Activity Sparkline Card -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="248" height="54" rx="8" fill="#0f0f13" stroke="#1f1f23" stroke-width="1" />
      <text x="14" y="19" class="mono-muted">DEVELOPMENT CADENCE</text>
      <text x="234" y="19" text-anchor="end" class="mono-meta" fill="#10b981">Active</text>

      <!-- Smooth Sparkline Curve -->
      <path d="M 14 43 Q 42 41, 62 34 T 106 36 T 152 28 T 198 31 T 234 23 L 234 47 L 14 47 Z" fill="url(#spark-grad)" />
      <path d="M 14 43 Q 42 41, 62 34 T 106 36 T 152 28 T 198 31 T 234 23" stroke="#10b981" stroke-width="1.6" fill="none" stroke-linecap="round" />
      <circle cx="234" cy="23" r="2.8" fill="#34d399">
        <animate attributeName="r" values="2;4;2" dur="2.4s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="604" y1="110" x2="604" y2="344" stroke="#1f1f23" stroke-width="1" />

  <!-- ================================================================= -->
  <!-- COLUMN 3: 03 / CURRENTLY BUILDING                                 -->
  <!-- ================================================================= -->
  <g transform="translate(626, 118)">
    <text x="0" y="0" class="section-index">03</text>
    <text x="24" y="0" class="section-title">CURRENTLY BUILDING</text>

    <!-- Work Item 1 -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="226" height="66" rx="8" fill="#111115" stroke="#1f1f23" stroke-width="1" />
      <rect x="14" y="15" width="30" height="30" rx="6" fill="#141d19" stroke="#10b981" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="29" cy="24" r="2.2" fill="#34d399" />
      <circle cx="23" cy="34" r="2.2" fill="#10b981" />
      <circle cx="35" cy="34" r="2.2" fill="#10b981" />
      <path d="M29 26 L23 32 M29 26 L35 32 M23 34 L35 34" stroke="#10b981" stroke-width="1.3" />

      <text x="54" y="28" class="item-title">Agentic Workflows &amp; ODD</text>
      <text x="54" y="47" class="item-sub">Organic-driven dev &amp; tooling</text>
    </g>

    <!-- Work Item 2 -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="226" height="66" rx="8" fill="#111115" stroke="#1f1f23" stroke-width="1" />
      <rect x="14" y="15" width="30" height="30" rx="6" fill="#16161c" stroke="#27272a" stroke-width="1" />
      <path d="M22 25 L29 22 L36 25 L29 28 Z" stroke="#a1a1aa" stroke-width="1.3" fill="none" />
      <path d="M22 30 L29 33 L36 30" stroke="#10b981" stroke-width="1.3" fill="none" stroke-linecap="round" />
      <path d="M22 34.5 L29 37.5 L36 34.5" stroke="#71717a" stroke-width="1.3" fill="none" stroke-linecap="round" />

      <text x="54" y="28" class="item-title">Backend &amp; Systems</text>
      <text x="54" y="47" class="item-sub">APIs, Docker infra &amp; Linux</text>
    </g>

    <!-- Compact Activity Row -->
    <g transform="translate(0, 174)">
      <rect x="0" y="0" width="108" height="46" rx="7" fill="#111115" stroke="#1f1f23" stroke-width="1" />
      <text x="14" y="29" class="stat-val">3 <tspan class="mono-muted" dx="4">Repos</tspan></text>

      <rect x="118" y="0" width="108" height="46" rx="7" fill="#111115" stroke="#1f1f23" stroke-width="1" />
      <text x="132" y="29" class="stat-val">6+ <tspan class="mono-muted" dx="2">Commits</tspan></text>
    </g>
  </g>

  <!-- Bottom Divider -->
  <line x1="38" y1="366" x2="852" y2="366" stroke="#1f1f23" stroke-width="1" />

  <!-- Footer Metadata -->
  <g transform="translate(38, 396)">
    <circle cx="5" cy="-4" r="2.5" fill="#10b981" />
    <text x="16" y="0" class="mono-meta">Portfolio <tspan fill="#f4f4f5">ivanolivera.dev</tspan>   ·   NFC Card <tspan fill="#f4f4f5">card.ivanolivera.dev</tspan></text>
    <text x="814" y="0" text-anchor="end" class="mono-muted">ES · EN · VAL   —   Updated automatically via GitHub Actions</text>
  </g>
</svg>